name: Test portable daemon
on:
  push:
    branches: [main, develop, develop-next]
  pull_request:
    branches: [main, develop, develop-next]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  daemon:
    name: TCP daemon (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - name: Real daemon, benchmark process and update contracts
        run: uv run --locked pytest -v --tb=long tests/test_daemon_portable.py tests/test_daemon_client.py tests/test_daemon_telemetry.py tests/test_daemon_http_routes.py tests/test_daemon_plugin_namespaces.py tests/test_daemon_services.py tests/test_benchmark_process_portable.py tests/test_update_portable.py tests/test_runtime_lease_portable.py tests/test_benchmark_encoding_portable.py
