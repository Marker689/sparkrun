name: tensorfold-dsv41-flash-tp2-ablit-next
description: DeepSeek-V4.1-Flash-1017 Mia EAQ 2.9bpw + Keys L10-35 wo_b abliteration on the updated TensorFold DeepSeek fork tip, TP2, local Engram, thinking+dashboard
model: /home/marker/.cache/huggingface/tensorfold-dsv41/bundle-ablit-next
runtime: tensorfold
container: ghcr.io/spark-arena/tensorfold-dsv41:2aa3c47
min_nodes: 2
max_nodes: 2
defaults:
  tf_family: dsv41
  tensor_parallel: 2
  port: 8000
  served_model_name: deepseek-v4.1-flash
  max_model_len: 1048576
  max_num_seqs: 4
  streams: 4
  pool: 1048576
  thinking: true
  dashboard: true
  engram_dir: /var/tmp/tensorfold-dsv41/engram
  max_tokens: 32768
  temperature: 1.0
  top_p: 1.0
  top_k: 20
  rdma_hca: rocep1s0f0,roceP2p1s0f0
  rdma_gid_index: 3
  nccl_ib_gid_index: 3
  tf_env:
    TF_DS_REPLAY_FLOOR: 1
    TF_SEED_RANDOM: 1
    TF_TOP_K_MAX: 56
distribution_config:
  containers:
    enabled: false
executor_config:
  volumes:
    - /var/tmp/tensorfold-dsv41/engram
