recipe_version: "2"
name: tensorfold-dsv41-flash-tp4
description: >-
  EXPERIMENTAL: DeepSeek-V4.1-Flash-1017 (EXL3 3.5 bpw) on four DGX Sparks using
  the community TensorFold fork (bertholomus/TensorFold @ 3ff3b2a + tonyd2wild
  TP4 patches), 2D TP split. Not upstream. Build the pinned image with
  docker/tensorfold-dsv41/build.sh --lane tp4 --load and prepare the bundle with
  scripts/tensorfold-dsv41-prepare.sh --world 4. `model:` MUST be the absolute
  prepared bundle path, identical on all four hosts.
model: /mnt/sparkrun/models/tensorfold-dsv41-flash-tp4
runtime: tensorfold
container: ghcr.io/spark-arena/tensorfold-dsv41:5940208
min_nodes: 4
max_nodes: 4
defaults:
  tf_family: dsv41
  tensor_parallel: 4
  port: 8000
  max_model_len: 1048576
  max_num_seqs: 16
  streams: 16
  pool: 2097152
  window: 2097152
  round_rows: 48
  served_model_name: deepseek-v4.1-flash
  thinking: false
  max_tokens: 32768
  temperature: 1.0
  top_p: 1.0
  top_k: 20
  rdma_hca: rocep1s0f0,roceP2p1s0f0
  served_k: solo
  tf_env:
    TF_RDMA_GID: 3
    TF_SEED_RANDOM: 1
    TF_TOP_K_MAX: 56

# The image is built on the Spark hosts (or published elsewhere); do not make
# the control machine pull/save it.  Each target still probes its local tag.
distribution_config:
  containers:
    enabled: false
